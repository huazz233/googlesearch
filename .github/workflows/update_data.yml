name: Update Data

on:
  schedule:
    - cron: '0 0 */7 * *'  # Run at UTC 0:00 every 7 days
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Add write permission
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # Fetch complete history

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'     # Enable pip cache
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "Warning: requirements.txt not found"
          # Install basic dependencies
          pip install httpx beautifulsoup4
        fi
        
    - name: List directory structure
      run: |
        echo "Current working directory:"
        pwd
        echo "\nRepository root contents:"
        ls -la
        echo "\ngooglesearch/config directory contents:"
        ls -la googlesearch/config || echo "googlesearch/config directory not found"
        echo "\ngooglesearch/config/data directory contents:"
        ls -la googlesearch/config/data || echo "googlesearch/config/data directory not found"
        
    - name: Verify Python environment
      run: |
        echo "Python version:"
        python --version
        echo "\nPip version:"
        pip --version
        echo "\nInstalled packages:"
        pip list
        
    - name: Update data files
      run: |
        cd googlesearch/config/data

        # Check required files
        required_files=(
          "update_data.py"
          "fetch_and_save_user_agents.py"
          "fetch_and_save_user_domain.py"
        )

        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Error: File not found: $file"
            exit 1
          fi
        done

        # Add execute permissions
        chmod +x *.py

        # Run update script
        if ! python update_data.py; then
          echo "Error: Update script execution failed"
          exit 1
        fi
        
    - name: Check for changes
      id: check_changes
      run: |
        if ! git diff --quiet; then
          echo "Changes detected"
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "No changes detected"
        fi
        
    - name: Commit and push if changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Check if files exist
        for file in "googlesearch/config/data/all_domain.txt" "googlesearch/config/data/user_agents.txt"; do
          if [ ! -f "$file" ]; then
            echo "Error: File not found: $file"
            exit 1
          fi
        done

        # Add and commit changes
        git add googlesearch/config/data/all_domain.txt googlesearch/config/data/user_agents.txt
        current_date=$(date '+%Y-%m-%d')

        # Get change statistics
        ua_changes=$(git diff --numstat googlesearch/config/data/user_agents.txt | awk '{print $1 + $2}' || echo "0")
        domain_changes=$(git diff --numstat googlesearch/config/data/all_domain.txt | awk '{print $1 + $2}' || echo "0")

        # Build commit message
        if [ "$ua_changes" != "0" ] && [ "$domain_changes" != "0" ]; then
          git commit -m "chore(data): 📊 Auto-update data files [$current_date]

        📱 User-Agent: ${ua_changes} lines changed
        🌐 Domain list: ${domain_changes} lines changed

        🤖 Auto-generated by GitHub Actions [skip ci]"
        elif [ "$ua_changes" != "0" ]; then
          git commit -m "chore(data): 📊 Auto-update data files [$current_date]

        📱 User-Agent: ${ua_changes} lines changed

        🤖 Auto-generated by GitHub Actions [skip ci]"
        elif [ "$domain_changes" != "0" ]; then
          git commit -m "chore(data): 📊 Auto-update data files [$current_date]

        🌐 Domain list: ${domain_changes} lines changed

        🤖 Auto-generated by GitHub Actions [skip ci]"
        else
          git commit -m "chore(data): 📊 Auto-update data files [$current_date]

        🤖 Auto-generated by GitHub Actions [skip ci]"
        fi
        
        # Push changes
        if ! git push; then
          echo "Error: Failed to push changes"
          exit 1
        fi
