name: Update Data

on:
  schedule:
    - cron: '0 0 */7 * *'  # Run at UTC 0:00 every 7 days
  workflow_dispatch:        # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: pip install httpx beautifulsoup4

    - name: Update domain list
      run: python scripts/update.py

    - name: Commit and push if changes
      run: |
        if git diff --quiet googlesearch/resources/all_domain.txt; then
          echo "No changes"
          exit 0
        fi

        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add googlesearch/resources/all_domain.txt
        git commit -m "chore(data): update domain list [$(date '+%Y-%m-%d')]"
        git push
